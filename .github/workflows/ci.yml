# ==============================================================================
# CI Workflow: Lint, Test, and Build
# Triggers on every pull request targeting main, and on pushes to main.
#
# Jobs:
#   1. lint    — ESLint + Prettier format check
#   2. test    — Node.js built-in test runner
#   3. build   — Next.js production build (catches type errors + build failures)
#
# All jobs must pass before a PR can be merged (enforce via GitHub branch
# protection rules: Settings → Branches → Require status checks to pass).
# ==============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - Dev
  push:
    branches:
      - main
      - dev
      - Dev

# Cancel any in-progress run for the same PR/branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: |
          if [ -f ".prettierrc.json" ]; then
            npm run format:check
          else
            echo "Prettier config not found — skipping format check."
          fi

  # ── 2. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (Node.js built-in runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build (Next.js production)
    runs-on: ubuntu-latest
    needs: lint

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
