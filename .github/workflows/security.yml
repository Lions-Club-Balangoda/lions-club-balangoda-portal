# ==============================================================================
# Security Workflow: Dependency & Secret Scanning
#
# Jobs:
#   1. dependency-audit — npm audit for known vulnerabilities (high/critical)
#   2. secret-scan      — Gitleaks scan for accidentally committed secrets
#
# Runs on every PR and on pushes to main.
# Results appear as check statuses on the PR; a failure blocks merging when
# branch protection rules are configured.
#
# No credentials are hard-coded or committed here.
# ==============================================================================

name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Dependency vulnerability audit ────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # --audit-level=high means only high and critical vulnerabilities
        # fail the build. Moderate and low are reported but do not block merge.
        run: npm audit --audit-level=high

  # ── 2. Secret scanning (Gitleaks) ────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is required for Gitleaks to scan all commits in the PR.
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for private repos on the paid plan.
          # For public repos or the free tier this env var can be omitted.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

