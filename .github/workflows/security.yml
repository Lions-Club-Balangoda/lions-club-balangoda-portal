# ==============================================================================
# Security Workflow: Dependency & Secret Scanning
#
# Jobs:
#   1. dependency-audit — npm audit for known vulnerabilities (high/critical)
#   2. secret-scan      — Gitleaks scan for accidentally committed secrets
#
# Runs on every PR and on pushes to main.
# Results appear as check statuses on the PR; a failure blocks merging when
# branch protection rules are configured.
# ==============================================================================

name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Dependency vulnerability audit ────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # --audit-level=high means only high and critical vulnerabilities fail the build
        run: npm audit --audit-level=high

  # ── 2. Secret scanning (Gitleaks) ────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks secret scan
        run: gitleaks detect --verbose --redact
